version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: gogain-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - gogain_network

  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: gogain-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - gogain_network
    healthcheck:
      disable: true   # 👈 disable healthcheck to avoid "unhealthy" status

  ai_service:
    build: .
    image: gogain-ai-service:latest
    container_name: gogain-ai-service
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - NO_PROXY=qdrant,localhost,127.0.0.1,::1
      - no_proxy=qdrant,localhost,127.0.0.1,::1
    depends_on:
      - redis
      - qdrant
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - gogain_network
    volumes:
      - ./:/app

volumes:
  qdrant_storage:

networks:
  gogain_network:
    driver: bridge
